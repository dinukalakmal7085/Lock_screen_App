plugins { id 'com.android.application' }

android {
    namespace 'com.luma.lockscreen'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.luma.lockscreen'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.2.0-beta.1'
    }
    flavorDimensions += 'edition'
    productFlavors {
        full {
            dimension 'edition'
            resValue 'string', 'app_name', 'Luma'
        }
        studio {
            dimension 'edition'
            versionNameSuffix '-studio'
            resValue 'string', 'app_name', 'Luma Studio'
        }
    }
    buildFeatures { buildConfig true }
    def signingNames = ['LUMA_UPLOAD_KEYSTORE_PATH','LUMA_UPLOAD_KEY_ALIAS','LUMA_UPLOAD_STORE_PASSWORD','LUMA_UPLOAD_KEY_PASSWORD']
    def signingReady = signingNames.every { System.getenv(it) }
    if (signingNames.any { System.getenv(it) } && !signingReady) {
        throw new GradleException('Incomplete upload-key configuration. Set all four LUMA_UPLOAD_* variables securely; never commit credentials.')
    }
    if (signingReady) {
        signingConfigs {
            upload {
                storeFile file(System.getenv('LUMA_UPLOAD_KEYSTORE_PATH'))
                keyAlias System.getenv('LUMA_UPLOAD_KEY_ALIAS')
                storePassword System.getenv('LUMA_UPLOAD_STORE_PASSWORD')
                keyPassword System.getenv('LUMA_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingReady) signingConfig signingConfigs.upload
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            def testHome = rootProject.file('.local/test-home')
            systemProperty 'user.home', testHome.absolutePath
            doFirst { testHome.mkdirs() }
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            ['https.proxyHost', 'https.proxyPort', 'http.proxyHost', 'http.proxyPort',
             'http.nonProxyHosts', 'javax.net.ssl.trustStore'].each { key ->
                if (System.getProperty(key)) systemProperty key, System.getProperty(key)
            }
        }
    }
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    compileOnly 'androidx.annotation:annotation:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
